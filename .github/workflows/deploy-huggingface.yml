name: Deploy to Hugging Face

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push the showcase to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable is not set; skipping deploy."
            exit 0
          fi
          mkdir space
          cp -r backend/evomind/api/static space/static
          sed 's#<head>#<head>\n<script>window.EVOMIND_STATIC = true;</script>#' backend/evomind/api/static/index.html > space/index.html
          cp deploy/huggingface/README.md space/
          cd space
          git init -q -b main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git lfs install --local
          git lfs track "*.bin" "*.mp3"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
